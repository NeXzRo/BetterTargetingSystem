name: Publish

on:
  push:
    tags:
      - '*.*.*.*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Get Environment Variables
        shell: pwsh
        run: |
          $tag = "${{ github.ref }}" -replace 'refs/tags/', ''
          "tag=$tag" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore BetterTargetingSystem/BetterTargetingSystem.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release BetterTargetingSystem/BetterTargetingSystem.csproj `
          -p:AssemblyVersion=${{ env.tag }} `
          -p:FileVersion=${{ env.tag }} `
          -p:PackageVersion=${{ env.tag }} `
          -p:InformationalVersion=${{ env.tag }} `
          --output ./build

      - name: Create ZIP
        run: Compress-Archive -Path ./build/* -DestinationPath ./build/latest.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./build/latest.zip
          token: ${{ secrets.GITHUB_TOKEN }}