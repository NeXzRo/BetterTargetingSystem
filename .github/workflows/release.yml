name: Release BetterTargetingSystemPvP

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0.0). Defaults to the ref this is dispatched on.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Resolve target tag
        id: tag
        shell: bash
        run: |
          ref_name="${{ github.ref_name }}"
          input_tag="${{ inputs.tag }}"
          if [ -n "$input_tag" ]; then
            target="$input_tag"
          else
            target="$ref_name"
          fi
          if [[ ! "$target" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Resolved target '$target' is not a v*.*.* tag — pass the tag input or dispatch on a tag ref."
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "version=${target#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $target"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.target }}
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud dev build
        shell: pwsh
        run: |
          $dalamudUrl = "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip"
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri $dalamudUrl -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - name: Build (Release)
        run: dotnet build BetterTargetingSystemPvP.sln --configuration Release

      - name: Stage latest.zip
        shell: pwsh
        run: |
          $src = 'BetterTargetingSystemPvP/bin/x64/Release/BetterTargetingSystemPvP/latest.zip'
          if (-not (Test-Path $src)) { throw "Plugin zip not found at $src" }
          Copy-Item $src 'latest.zip' -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.target }}
          name: ${{ steps.tag.outputs.target }}
          files: latest.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Fetch total download count
        id: count
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          total=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[].assets[].download_count] | add // 0')
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Update local repo.json
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          TOTAL="${{ steps.count.outputs.total }}"
          TIMESTAMP=$(date +%s)
          python3 - <<PYEOF
          import json, os
          with open('repo.json', 'r', encoding='utf-8-sig') as f:
              data = json.load(f)
          data[0]['AssemblyVersion'] = os.environ['VERSION']
          data[0]['TestingAssemblyVersion'] = os.environ['VERSION']
          data[0]['DownloadCount'] = int(os.environ['TOTAL'])
          data[0]['LastUpdate'] = int(os.environ['TIMESTAMP'])
          with open('repo.json', 'w', encoding='utf-8', newline='\n') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PYEOF
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TOTAL: ${{ steps.count.outputs.total }}

      - name: Commit local repo.json
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add repo.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Release ${{ steps.tag.outputs.target }}: bump repo.json"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $i); retrying..."
            sleep 2
          done
          echo "Failed to push repo.json bump after 5 attempts."
          exit 1

      - name: Mirror entry into NeXzRo/Repo
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ -z "$REPO_TOKEN" ]; then exit 0; fi
          git clone --depth 1 "https://x-access-token:${REPO_TOKEN}@github.com/NeXzRo/Repo.git" hub
          cd hub
          python3 - <<PYEOF
          import json

          with open('../repo.json', 'r', encoding='utf-8-sig') as f:
              local_entry = json.load(f)[0]

          with open('repo.json', 'r', encoding='utf-8-sig') as f:
              hub_data = json.load(f)

          if not isinstance(hub_data, list):
              hub_data = [hub_data]

          found = False
          for i, entry in enumerate(hub_data):
              if entry.get('InternalName') == local_entry.get('InternalName'):
                  hub_data[i] = local_entry
                  found = True
                  break
          if not found:
              hub_data.append(local_entry)

          with open('repo.json', 'w', encoding='utf-8', newline='\n') as f:
              json.dump(hub_data, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PYEOF
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add repo.json
          if git diff --cached --quiet; then
            echo 'Hub repo.json already up to date.'
            exit 0
          fi
          INTERNAL=$(python3 -c "import json; d=json.load(open('../repo.json')); print(d[0]['InternalName'])")
          VERSION=$(python3 -c "import json; d=json.load(open('../repo.json')); print(d[0]['AssemblyVersion'])")
          git commit -m "Bump ${INTERNAL} to ${VERSION}"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $i); retrying..."
            sleep 2
          done
          echo "Failed to push hub update after 5 attempts."
          exit 1
